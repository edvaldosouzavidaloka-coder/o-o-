name: TG + EDVALDO Criador de Cercas e Porteiras FS25 v1.4.1 PC Objects Foco Janelas Windows

on:
  push:
    branches:
      - tg-edvaldo-v1-4-1-foco-janelas
    paths:
      - 'TG_Cerca_Editor_GE10/**'
      - '.github/workflows/top-gamers-cercas-windows-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Pillow para o fundo e icone
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pillow

      - name: Instalar leitor I3D usado e testado no projeto
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath 'TG_Cerca_Editor_GE10_v0.2/TG_Cerca_Editor_GE10_v0.2_I3D_TESTE.zip' -DestinationPath './leitor-i3d' -Force
          Copy-Item './leitor-i3d/TG_Cerca_Editor_GE10_v0.2/tg_i3d.py' 'TG_Cerca_Editor_GE10/tg_i3d.py'
          Copy-Item './leitor-i3d/TG_Cerca_Editor_GE10_v0.2/MIT_TERCEIROS.txt' 'TG_Cerca_Editor_GE10/MIT_TERCEIROS.txt'

      - name: Sintaxe do codigo
        shell: pwsh
        run: |
          python -m py_compile TG_Cerca_Editor_GE10/TG_Cerca_Editor.py TG_Cerca_Editor_GE10/TG_Cerca_Editor_v05.py TG_Cerca_Editor_GE10/TG_Cerca_Editor_v06.py TG_Cerca_Editor_GE10/TG_Cerca_Editor_v07.py TG_Cerca_Editor_GE10/TG_Cerca_Geometria_v07.py TG_Cerca_Editor_GE10/TG_Cerca_Editor_v08.py TG_Cerca_Editor_GE10/TG_Cerca_Editor_v09.py TG_Cerca_Editor_GE10/TG_Cerca_AntiDuplicatas_v09.py TG_Cerca_Editor_GE10/TG_Cerca_Segmentos_Originais_v091.py TG_Cerca_Editor_GE10/TG_Cerca_Editor_v11.py TG_Cerca_Editor_GE10/TG_PCObjects_Core_v11.py TG_Cerca_Editor_GE10/TG_PCObjects_Localizador_v12.py TG_Cerca_Editor_GE10/TG_Cerca_Editor_v13.py TG_Cerca_Editor_GE10/TG_PCObjects_Registros_v13.py TG_Cerca_Editor_GE10/TG_PCObjects_Export_v14.py TG_Cerca_Editor_GE10/TG_Cerca_Editor_v14.py TG_Cerca_Editor_GE10/TG_Cerca_Editor_v141.py TG_Cerca_Editor_GE10/tg_brand_photo_v06.py TG_Cerca_Editor_GE10/tg_i3d.py

      - name: Teste real do formato da spline I3D e shapes
        shell: pwsh
        run: |
          $env:PYTHONPATH='TG_Cerca_Editor_GE10'
          python -c "from pathlib import Path; from TG_Cerca_Editor_v06 import core; pts,n,k=core.load_i3d_points(Path('leitor-i3d/TG_Cerca_Editor_GE10_v0.2/EXEMPLO/sa.i3d')); assert len(pts)>26; print('I3D OK',len(pts),'pontos',n)"

      - name: Testar modelos newFence, foto e segmentos
        working-directory: TG_Cerca_Editor_GE10
        shell: pwsh
        run: python TESTAR_v06.py

      - name: Testar abertura da interface Tkinter
        working-directory: TG_Cerca_Editor_GE10
        shell: pwsh
        run: |
          python -c "from TG_Cerca_Editor_v06 import App; a=App(); a.update_idletasks(); a.destroy(); print('Interface v0.7 iniciou e fechou corretamente')"

      - name: Testar agrupamento de paineis e porteiras em 5 modelos
        working-directory: TG_Cerca_Editor_GE10
        shell: pwsh
        run: python TESTAR_v07.py

      - name: Testar interface SEM foto e porteira clicavel
        working-directory: TG_Cerca_Editor_GE10
        shell: pwsh
        run: python TESTAR_v08.py

      - name: Testar deteccao de duplicatas e substituicao com seguranca
        working-directory: TG_Cerca_Editor_GE10
        shell: pwsh
        run: python TESTAR_v09.py

      - name: Testar segmentos originais v0.1 com interface v0.9 preservada
        working-directory: TG_Cerca_Editor_GE10
        shell: pwsh
        run: python TESTAR_v091.py

      - name: Testar importacao I3D de PC Objects, XMLs e interface
        working-directory: TG_Cerca_Editor_GE10
        shell: pwsh
        run: python TESTAR_v11.py

      - name: Testar registros independentes Placeables e StoreItems v1.3
        working-directory: TG_Cerca_Editor_GE10
        shell: pwsh
        run: python TESTAR_v13.py

      - name: Testar exportacao I3D, posicao, rotacao e XML decorativo com loja
        working-directory: TG_Cerca_Editor_GE10
        shell: pwsh
        run: python TESTAR_v14.py

      - name: Testar foco de PC Objects e minimizacao da janela principal no Windows
        working-directory: TG_Cerca_Editor_GE10
        shell: pwsh
        run: python TESTAR_v141.py

      - name: Criar icone da marca TG + EDVALDO
        working-directory: TG_Cerca_Editor_GE10
        shell: pwsh
        run: python GERAR_ICONE_v06.py

      - name: Instalar PyInstaller
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pyinstaller

      - name: Compilar EXE independente do Python
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --icon TG_Cerca_Editor_GE10/tg_edvaldo.ico --name TG_EDVALDO_FS25_v141_PCObjects TG_Cerca_Editor_GE10/TG_Cerca_Editor_v141.py

      - name: Preparar arquivos para download
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'publicar' | Out-Null
          Copy-Item dist/TG_EDVALDO_FS25_v141_PCObjects.exe publicar/
          Copy-Item TG_Cerca_Editor_GE10/README-v141.md publicar/
          Copy-Item TG_Cerca_Editor_GE10/MIT_TERCEIROS.txt publicar/
          Compress-Archive -Path publicar/* -DestinationPath TG_EDVALDO_FS25_v141_PCObjects_Windows.zip -Force

      - name: Enviar EXE ao GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: TG_EDVALDO_FS25_v141_PCObjects
          path: TG_EDVALDO_FS25_v141_PCObjects_Windows.zip
          retention-days: 90

      - name: Publicar Release beta no GitHub
        uses: softprops/action-gh-release@v3
        with:
          tag_name: tg-edvaldo-fs25-v1.4.1-foco-janelas-beta
          target_commitish: ${{ github.sha }}
          name: TG + EDVALDO — Criador de Cercas e PORTEIRAS FS25 v1.4.1 PC Objects (I3D Beta)
          prerelease: true
          make_latest: false
          body: |
            v1.4.1: minimiza janela principal ao abrir PC Objects e mantém seletores vinculados à janela secundária.
            Marca TG + EDVALDO no titulo e icone. Leitura somente I3D + i3d.shapes.
            XML decorativo e icone PNG opcionais; permanece necessario XML proprio para silos/fabricas funcionais. Registros separados e confirmados.
            Ainda requer teste real no FS25: fios e demolicao por trecho nao sao garantidos.
            Faca backup de savegame e confira o log.txt.
          files: |
            publicar/TG_EDVALDO_FS25_v141_PCObjects.exe
            TG_EDVALDO_FS25_v141_PCObjects_Windows.zip
          fail_on_unmatched_files: true
