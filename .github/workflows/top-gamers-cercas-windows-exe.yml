name: TOP GAMERS Cercas FS25 - Windows I3D v0.5

on:
  push:
    branches: [tg-cerca-editor-fs25-v0-5-segmentos]
    paths:
      - 'TG_Cerca_Editor_GE10/**'
      - '.github/workflows/top-gamers-cercas-windows-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe-windows:
    name: Compilar TOP GAMERS v0.5 I3D
    runs-on: windows-latest
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extrair leitor I3D v0.2 ja testado
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath 'TG_Cerca_Editor_GE10_v0.2/TG_Cerca_Editor_GE10_v0.2_I3D_TESTE.zip' -DestinationPath './leitor-i3d' -Force
          Copy-Item 'leitor-i3d/TG_Cerca_Editor_GE10_v0.2/tg_i3d.py' 'TG_Cerca_Editor_GE10/tg_i3d.py'
          Copy-Item 'leitor-i3d/TG_Cerca_Editor_GE10_v0.2/MIT_TERCEIROS.txt' 'TG_Cerca_Editor_GE10/MIT_TERCEIROS.txt'

      - name: Conferir sintaxe e importacoes
        shell: pwsh
        run: |
          python -m py_compile TG_Cerca_Editor_GE10/TG_Cerca_Editor.py TG_Cerca_Editor_GE10/TG_Cerca_Editor_v03.py TG_Cerca_Editor_GE10/TG_Cerca_Editor_v05.py TG_Cerca_Editor_GE10/tg_i3d.py
          $env:PYTHONPATH = 'TG_Cerca_Editor_GE10'
          python -c "import TG_Cerca_Editor_v05 as a; print('Janela:', a.App.__name__)"

      - name: Testar I3D real e shapes vinculado
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'TG_Cerca_Editor_GE10'
          python -c "from pathlib import Path; from TG_Cerca_Editor_v05 import load_i3d_points; p=Path('leitor-i3d/TG_Cerca_Editor_GE10_v0.2/EXEMPLO/sa.i3d'); pts,nome,kind=load_i3d_points(p); assert len(pts)>26, len(pts); print('OK I3D:',nome,kind,len(pts),'amostras')"

      - name: Testar compactacao de segmentos
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'TG_Cerca_Editor_GE10'
          python -c "from TG_Cerca_Editor_v05 import run_compaction_tests; print('Segmentos (reta de 500m, curva, reta 2 pontos):', run_compaction_tests())"

      - name: Instalar PyInstaller
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pyinstaller

      - name: Gerar EXE standalone
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name TOP_GAMERS_Cercas_FS25_v05_I3D TG_Cerca_Editor_GE10/TG_Cerca_Editor_v05.py

      - name: Empacotar aplicativo e instrucoes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publicar | Out-Null
          Copy-Item dist/TOP_GAMERS_Cercas_FS25_v05_I3D.exe publicar/
          Copy-Item TG_Cerca_Editor_GE10/README-v05.md publicar/
          Copy-Item TG_Cerca_Editor_GE10/MIT_TERCEIROS.txt publicar/
          Compress-Archive -Path publicar/* -DestinationPath TOP_GAMERS_Cercas_FS25_v05_I3D_Windows.zip -Force

      - name: Disponibilizar EXE pelo Actions
        uses: actions/upload-artifact@v4
        with:
          name: TOP_GAMERS_Cercas_FS25_v05_I3D
          path: TOP_GAMERS_Cercas_FS25_v05_I3D_Windows.zip
          retention-days: 90

      - name: Publicar EXE no Releases BETA
        uses: softprops/action-gh-release@v3
        with:
          tag_name: tg-cercas-fs25-v0.5-i3d-beta
          target_commitish: ${{ github.sha }}
          name: TOP GAMERS Criador de Cercas FS25 v0.5 I3D Compacto Beta
          prerelease: true
          make_latest: false
          body: |
            Esta versao recebe arquivos .i3d e .i3d.shapes, sem CSV.
            Modelo Brazilian Fences nao incluso. Use copia de um save.
            Reduz linhas segment em retas usando trechos de 25m. Curvas e relevo preservados por tolerancias.
            Curvas cubicas aproximadas; fios e demolicao ainda exigem teste no FS25.
          files: |
            publicar/TOP_GAMERS_Cercas_FS25_v05_I3D.exe
            TOP_GAMERS_Cercas_FS25_v05_I3D_Windows.zip
          fail_on_unmatched_files: true
