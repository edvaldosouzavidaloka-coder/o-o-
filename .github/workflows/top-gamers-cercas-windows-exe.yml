name: TOP GAMERS - EXE Windows Cercas FS25 v0.4 inspection

on:
  push:
    branches:
      - tg-cerca-editor-fs25-v0-4-i3d
    paths:
      - 'TG_Cerca_Editor_GE10/**'
      - '.github/workflows/top-gamers-cercas-windows-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe-windows:
    name: Compilar e verificar EXE no Windows
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Show existing I3D reader for integration
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath 'TG_Cerca_Editor_GE10_v0.2/TG_Cerca_Editor_GE10_v0.2_I3D_TESTE.zip' -DestinationPath './inspect' -Force
          Write-Host '===I3D_READER_BEGIN==='
          Get-Content './inspect/TG_Cerca_Editor_GE10_v0.2/tg_i3d.py' -Raw
          Write-Host '===I3D_READER_END==='
          Write-Host '===I3D_GUI_BEGIN==='
          Get-Content './inspect/TG_Cerca_Editor_GE10_v0.2/TG_Cerca_Editor.py' -Raw
          Write-Host '===I3D_GUI_END==='
      - name: Verificar sintaxe Python
        shell: pwsh
        run: |
          python -m py_compile TG_Cerca_Editor_GE10/TG_Cerca_Editor.py TG_Cerca_Editor_GE10/TG_Cerca_Editor_v03.py
      - name: Verificar importações da interface
        shell: pwsh
        run: |
          $env:PYTHONPATH = "TG_Cerca_Editor_GE10"
          python -c "import TG_Cerca_Editor_v03 as m; print('App:', m.App.__name__)"
      - name: Instalar PyInstaller
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pyinstaller
      - name: Compilar executável
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name TOP_GAMERS_Cercas_FS25_v03 TG_Cerca_Editor_GE10/TG_Cerca_Editor_v03.py
      - name: Criar pacote para download
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publicar | Out-Null
          Copy-Item dist/TOP_GAMERS_Cercas_FS25_v03.exe publicar/
          Copy-Item TG_Cerca_Editor_GE10/README-v03.md publicar/
          Compress-Archive -Path publicar/* -DestinationPath TOP_GAMERS_Cercas_FS25_v03_Windows.zip -Force
      - name: Enviar EXE para o GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: TOP_GAMERS_Cercas_FS25_v03_EXE
          path: TOP_GAMERS_Cercas_FS25_v03_Windows.zip
          retention-days: 90
